global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "__ALERTMANAGER_HOSTPORT__"

scrape_configs:
  - job_name: sample-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "__SAMPLE_APP_1_HOSTPORT__"
          - "__SAMPLE_APP_2_HOSTPORT__"
          - "__SAMPLE_APP_3_HOSTPORT__"